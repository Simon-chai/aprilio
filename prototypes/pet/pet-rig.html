<style>

  .btn{

  .split{display:flex;gap:6px;margin-top:8px}

  .slider label{font-size:11.5px;color:var(--ink2)}
  .slider output{font:11px ui-monospace,monospace;color:var(--ink3);text-align:right}
  input[type=range]{width:100%;accent-color:var(--blue);height:3px}

  .pivot-list{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow-y:auto}
  .pivot-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 6px;border-radius:8px;cursor:pointer}
  .pivot-row:hover{background:rgba(255,255,255,.05)}

  .pivot-row .nm{flex:1;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ink2)}

  pre.manifest{margin:0;max-height:190px;overflow:auto;background:#111114;border:1px solid var(--line);border-radius:10px;padding:10px;font:11px/1.6 ui-monospace,monospace;color:#9fd0a8;white-space:pre}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:9px}
  @media (max-width:940px){body{overflow:auto}main{grid-template-columns:1fr;height:auto}.stage{min-height:360px}}

      var a = ep ? P.earTwitch * 7 * pair[1] : 0;
      wp.setAttribute("transform", ep ? "rotate(" + a + " " + ep[0] + " " + ep[1] + ")" : "");
    });
    // 眼睛：眨眼（无变体时）+ 开合
    if (!useFace) {
      ["pet-eye-l", "pet-eye-r"].forEach(function (id) {
        var wp = w[id], ep = rig.pivots[id];
        if (!wp || !ep) return;
        var k = Math.max(0.06, P.eyeOpen);
        wp.setAttribute("transform", "translate(" + ep[0] + " " + ep[1] + ") scale(1 " + k + ") translate(" + -ep[0] + " " + -ep[1] + ")");
      });
    }
    // 瞳孔视线
    rig.variants.pupil.forEach(function (el) {
      if (!el) return;
      el.setAttribute("transform", "translate(" + (P.eyeBallX * unit * 1.6) + " " + (P.eyeBallY * unit * 1.6) + ")");
    });
    // 嘴：无变体时缩放
    if (!rig.hasVariants && w["pet-mouth"]) {
      var mp = rig.pivots["pet-mouth"] || [rig.centerX, rig.groundY];
      var k2 = 0.5 + P.mouthOpenY * 1.8;
      w["pet-mouth"].setAttribute("transform",
        "translate(" + mp[0] + " " + mp[1] + ") scale(" + (0.8 + P.mouthOpenY * 0.4) + " " + k2 + ") translate(" + -mp[0] + " " + -mp[1] + ")");
    }
    $("#statChip").textContent =
      Object.keys(rig.found).length + " 图层 · " + Object.keys(rig.pivots).length + " 锚点" +
      (rig.hasVariants ? " · 双嘴型" : "") + (useFace ? " · 表情变体" : "");
  }

  /* ============================================================
   * 7. 状态机
   * ============================================================ */
  var STATES = {
    idle: "待机", thinking: "思考中", talking: "说话中", working: "执行中",
    happy: "开心", asleep: "睡觉", sad: "受挫"
  };
  var speak = null;

  function setFace(m) { if (faceMode !== m) faceMode = m; }

  function setState(next) {
    if (!STATES[next]) return;
    state = next;
    stateAt = performance.now();
    $("#stateChip").textContent = STATES[next];
    $$("#stateBtns .btn").forEach(function (b) { b.classList.toggle("active", b.dataset.state === next); });
    if (next === "happy") { setFace("happy"); bubble("好耶！", 1200); }
    else if (next === "asleep") { setFace("sleep"); bubble("💤", 0); }
    else if (next === "sad") { setFace("normal"); bubble("唔……", 1400); }
    else if (next === "working") { setFace("normal"); bubble("正在调用工具…", 0); }
    else if (next === "thinking") { setFace("normal"); bubble("让我想想…", 0); }
    else { setFace("normal"); hideBubble(); }
    if (next === "happy" || next === "sad") {
      window.setTimeout(function () { if (state === next) setState("idle"); }, 1500);
    }
  }
  function bubble(t, ms) {
    $("#bubble").textContent = t;
    $("#bubble").classList.add("show");
    if (ms > 0) window.setTimeout(hideBubble, ms);
  }
  function hideBubble() { $("#bubble").classList.remove("show"); }

  function drive() {
    var t = performance.now() / 1000;
    if (manual) { T.breath = Math.sin(t * 1.8); T.tailSway = Math.sin(t * 2.2) * tailAmp * 2; blinkTick(); return; }

    T.blush = 0.35; T.squish = 0; T.headDrop = 0; T.hop = 0; T.earTwitch = 0; T.eyeOpen = 1;

    if (state === "idle") {
      T.breath = Math.sin(t * 1.8);
      T.tailSway = Math.sin(t * 2.1) * tailAmp * (1 + idleImpulse * 1.5);
      T.eyeBallX = Math.sin(t * 0.45) * 0.3;
      T.eyeBallY = Math.sin(t * 0.7) * 0.12;
      T.bodyAngleZ = Math.sin(t * 1.8) * 0.8 + idleImpulse * 1.6 * Math.sin(t * 9);
      T.mouthOpenY = 0.02;
      T.earTwitch = idleImpulse * Math.sin(t * 14) * 0.5;
    } else if (state === "thinking") {
      T.breath = Math.sin(t * 1.4); T.tailSway = Math.sin(t * 1.1) * tailAmp * 0.5;
      T.eyeBallX = Math.sin(t * 3.1) * 0.9; T.eyeBallY = -0.45;
      T.bodyAngleZ = Math.sin(t * 1.1) * 1.5; T.headAngleZ = Math.sin(t * 1.6) * 2.2;
      T.mouthOpenY = 0;
    } else if (state === "talking") {
      T.breath = Math.sin(t * 2.2); T.tailSway = Math.sin(t * 3.4) * tailAmp * 1.1;
      T.eyeBallX = Math.sin(t * 1.2) * 0.5; T.bodyAngleZ = Math.sin(t * 2.6) * 1.1;
      T.headAngleZ = Math.sin(t * 2.6) * 2.4; T.blush = 0.55;
      if (speak) {
        var prog = Math.floor((performance.now() - speak.t0) / 70);
        if (prog > speak.i) speak.i = prog;
        T.mouthOpenY = Math.abs(Math.sin(speak.i * 0.85)) * (0.6 + Math.sin(speak.i * 2.7) * 0.4);
        if (speak.i >= speak.text.length + 4) { speak = null; setState("idle"); }
      } else {
        T.mouthOpenY = Math.abs(Math.sin(t * 11)) * 0.7;
      }
    } else if (state === "working") {
      T.breath = Math.sin(t * 3.4) * 0.7; T.tailSway = Math.sin(t * 6) * tailAmp * 1.2;
      T.bodyAngleZ = Math.sin(t * 13) * 2.2; T.headAngleZ = Math.sin(t * 13) * 1.5;
      T.mouthOpenY = 0.04; T.eyeBallX = Math.sin(t * 8) * 0.35; T.earTwitch = Math.sin(t * 9) * 0.6;
    } else if (state === "happy") {
      var k = Math.min(1, (performance.now() - stateAt) / 320);
      var arc = Math.sin(Math.min(Math.PI, k * Math.PI * 2.2));
      T.hop = Math.max(0, arc) * 1.2; T.squish = -arc * 0.5;
      T.breath = Math.sin(t * 4) * 0.6; T.tailSway = Math.sin(t * 8) * tailAmp * 1.5;
      T.mouthOpenY = 0.8; T.blush = 0.95; T.headAngleZ = Math.sin(t * 8) * 3;
    } else if (state === "asleep") {
      T.breath = Math.sin(t * 0.85) * 1.8; T.tailSway = Math.sin(t * 0.6) * tailAmp * 0.3;
      T.bodyAngleZ = Math.sin(t * 0.85) * 1.5; T.headDrop = 0.85; T.mouthOpenY = 0.1; T.blush = 0.4;
    } else if (state === "sad") {
      T.breath = Math.sin(t * 1.2) * 0.7; T.tailSway = Math.sin(t * 0.9) * tailAmp * 0.3;
      T.eyeBallY = 0.5; T.headDrop = 0.8; T.mouthOpenY = 0.03; T.blush = 0.15;
    }
    blinkTick();
  }

  function blinkTick() {
    var now = performance.now();
    if (now > idleNext) { idleNext = now + 4200 + Math.random() * 5200; idleImpulse = 1; }
    if (idleImpulse > 0) idleImpulse = Math.max(0, idleImpulse - 0.012);
    if (faceMode === "normal") {
      if (now > nextBlink && now > blinkUntil) {
        blinkUntil = now + (state === "working" ? 90 : 130);
        nextBlink = now + 2200 + Math.random() * 3400;
      }
      T.eyeOpen = now < blinkUntil ? 0 : 1;
    }
  }

  function frame() {
    drive();
    integrate();
    apply();
    requestAnimationFrame(frame);
  }

  /* ============================================================
   * 8. Agent 回合模拟
   * ============================================================ */
  function onAgentEvent(e) {
    if (e.type === "text-delta") {
      if (state !== "talking") setState("talking");
      if (!speak) speak = { text: e.text, i: 0, t0: performance.now() };
      else speak.text += e.text;
    } else if (e.type === "tool-start") {
      speak = null; setState("working");
    } else if (e.type === "tool-end") {
      setState(e.ok === false ? "sad" : "happy");
    }
  }

  function simulate() {
    if (busy) return;
    busy = true;
    setState("thinking"); speak = null;
    var seq = [
      function () { onAgentEvent({ type: "tool-start", name: "query_students" }); },
      function () { onAgentEvent({ type: "tool-end", name: "query_students" }); },
      function () { onAgentEvent({ type: "text-delta", text: "四年级一班最近三次测验我都看过了，" }); },
      function () { onAgentEvent({ type: "text-delta", text: "有 3 位同学的成绩连续下滑，需要重点关注。" }); }
    ];
    var i = 0;
    var step = function () {
      if (i >= seq.length) {
        window.setTimeout(function () {
          busy = false;
          window.setTimeout(function () { if (state !== "talking") setState("idle"); }, 1200);
        }, 900);
        return;
      }
      seq[i++]();
      window.setTimeout(step, 620 + Math.random() * 400);
    };
    step();
  }

  /* ============================================================
   * 9. 导出
   * ============================================================ */
  function currentManifest() {
    var slots = {}, piv = {};
    Object.keys(rig.found).forEach(function (k) { slots[k] = rig.found[k].label; });
    Object.keys(rig.pivots).forEach(function (k) { piv[k] = rig.pivots[k]; });
    return {
      schema: "aprilio.pet/1",
      id: "custom-layered",
      name: "自定义分层形象",
      runtime: "vector-layered",
      author: "me",
      version: "1.0.0",
      canvas: {
        viewBox: [rig.vb.x, rig.vb.y, rig.vb.w, rig.vb.h].join(" "),
        centerX: Math.round(rig.centerX),
        groundLineY: Math.round(rig.groundY)
      },
      vector: { source: "assets/model.svg", slots: slots, pivots: piv },
      behavior: { blinkIntervalMs: [2200, 5600], tailAmp: 0.6 }
    };
  }
  function renderManifest() {
    if (!rig) return;
    $("#manifest").textContent = JSON.stringify(currentManifest(), null, 2);
  }

  /* ============================================================
   * 10. UI
   * ============================================================ */
  function loadSvgText(text, label) {
    try {
      var doc = new DOMParser().parseFromString(text, "image/svg+xml");
      if (doc.querySelector("parsererror")) throw new Error("XML 解析失败，文件可能不是合法 SVG");
      var svg = doc.documentElement;
      if (!svg || svg.nodeName === "parsererror") throw new Error("没有找到 <svg> 根节点");
      assemble(svg);
      $("#tagName").textContent = label;
    } catch (err) {
      $("#report").innerHTML = '<div class="item error"><div class="bul"></div><div>加载失败：' +
        String((err && err.message) || err) + "</div></div>";
    }
  }

  function readFile(f) {
    var fr = new FileReader();
    fr.onload = function () { loadSvgText(String(fr.result), "文件 · " + f.name); };
    fr.readAsText(f);
  }

  $("#btnPick").onclick = function () { $("#fileSvg").click(); };
  $("#fileSvg").onchange = function (e) { if (e.target.files[0]) readFile(e.target.files[0]); e.target.value = ""; };
  $("#btnTemplate").onclick = function () { loadSvgText(TEMPLATE_SVG, "模板 · 橘猫"); };

  var stage = $("#stage");
  ["dragenter", "dragover"].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.remove("drag"); });
  });
  stage.addEventListener("drop", function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  // 下载模板
  $("#btnDownloadTpl").onclick = function () {
    var blob = new Blob([TEMPLATE_SVG], { type: "image/svg+xml" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "layered-cat.pet.svg";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  // 背景 / 锚点 / 参考线
  var bgModes = ["bg-check", "bg-light", ""];
  var bgLabels = ["背景：棋盘", "背景：浅色", "背景：深色"];
  var bgIdx = 0;
  $("#btnBg").onclick = function () {
    stage.classList.remove("bg-check", "bg-light");
    bgIdx = (bgIdx + 1) % 3;
    if (bgModes[bgIdx]) stage.classList.add(bgModes[bgIdx]);
    this.textContent = bgLabels[bgIdx];
  };
  $("#btnAnchors").onclick = function () {
    showAnchors = !showAnchors;
    this.classList.toggle("active", showAnchors);
    this.textContent = "锚点：" + (showAnchors ? "显示" : "隐藏");
    renderPivots();
  };
  $("#btnGrid").onclick = function () {
    showGrid = !showGrid;
    this.classList.toggle("active", showGrid);
    this.textContent = "参考线：" + (showGrid ? "开" : "关");
    renderPivots();
  };
  $("#btnAnchors").classList.add("active");
  $("#btnGrid").classList.add("active");

  $("#btnAutoPivot").onclick = function () {
    if (!rig) return;
    SLOTS.forEach(function (s) {
      var el = rig.els[s.id];
      if (!el || s.pivot === "none") return;
      var basisEl = s.basis ? rig.svg.querySelector("#" + s.basis) : null;
      rig.pivots[s.id] = inferPivot(basisEl || el, s.pivot, rig.vb, rig.groundY, rig.centerX);
    });
    renderPivots(); renderPivotList(); renderManifest();
  };

  // 状态按钮
  (function () {
    var box2 = $("#stateBtns");
    Object.keys(STATES).forEach(function (k) {
      var b = document.createElement("button");
      b.className = "btn" + (state === k ? " active" : "");
      b.textContent = STATES[k];
      b.dataset.state = k;
      b.onclick = function () { speak = null; setState(k); };
      box2.appendChild(b);
    });
  })();

  $("#btnSim").onclick = simulate;

  var btnManual = $("#btnManual");
  function setManual(on) {
    manual = on;
    btnManual.classList.toggle("active", on);
    btnManual.textContent = on ? "手动参数：开" : "手动参数";
    if (on) { speak = null; hideBubble(); }
  }
  btnManual.onclick = function () { setManual(!manual); };

  var sliders = [
    ["pMouth", "oMouth", "mouthOpenY", 100],
    ["pEyeX", "oEyeX", "eyeBallX", 100],
    ["pEyeY", "oEyeY", "eyeBallY", 100],
    ["pTilt", "oTilt", "bodyAngleZ", 10],
    ["pTail", "oTail", "__tailAmp", 100],
    ["pDrop", "oDrop", "headDrop", 100]
  ];
  sliders.forEach(function (s) {
    var input = $("#" + s[0]), out = $("#" + s[1]);
    input.addEventListener("input", function () {
      var v = Number(input.value);
      out.textContent = String(v);
      if (!manual) setManual(true);
      if (s[2] === "__tailAmp") tailAmp = v / 100 * 2;
      else T[s[2]] = v / s[3];
    });
  });

  $("#btnCopy").onclick = function () {
    var t = $("#manifest").textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
  };
  $("#btnDownload").onclick = function () {
    if (!rig) return;
    var m = currentManifest();
    var blob = new Blob([JSON.stringify(m, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pet.json";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  /* ============================================================
   * 11. 启动
   * ============================================================ */
  loadSvgText(TEMPLATE_SVG, "模板 · 橘猫");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
