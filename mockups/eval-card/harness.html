<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>foreignObject 转 PNG 验证</title></head>
<body style="margin:0;background:#444">
<div id="status" style="color:#fff;padding:8px;font-family:monospace">loading…</div>
<img id="out" style="display:block;width:750px;background:#fff">
<iframe id="src" src="a-warm.html" style="position:absolute;left:-9999px;top:0;width:750px;height:1600px"></iframe>
<script>
// 与未来 src/lib/html-to-png.ts 完全一致的算法（foreignObject + canvas 2x）
async function htmlToPng(doc, selector, scale) {
  const el = doc.querySelector(selector);
  const styleEl = doc.querySelector("style");
  const rect = el.getBoundingClientRect();
  const w = Math.ceil(rect.width), h = Math.ceil(rect.height);
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
    '<foreignObject width="100%" height="100%">' +
    '<div xmlns="http://www.w3.org/1999/xhtml" style="font-family:\'PingFang SC\',\'Microsoft YaHei\',system-ui,sans-serif">' +
    '<style>' + styleEl.textContent + '</style>' + el.outerHTML +
    '</div></foreignObject></svg>';
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("svg load failed")); img.src = url; });
  const canvas = document.createElement("canvas");
  canvas.width = w * scale; canvas.height = h * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL("image/png");
}
document.getElementById("src").onload = async () => {
  const doc = document.getElementById("src").contentDocument;
  try {
    const png = await htmlToPng(doc, ".card", 2);
    document.getElementById("out").src = png;
    document.getElementById("status").textContent = "OK bytes=" + Math.round(png.length / 1024) + "KB";
  } catch (e) {
    document.getElementById("status").textContent = "FAIL: " + (e && e.message);
  }
};
</script>
</body>
</html>
