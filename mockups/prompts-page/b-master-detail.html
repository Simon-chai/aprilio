<!DOCTYPE html>
<!-- 方案 B · 分组分段筛选 + 紧凑模块列表（主从布局精修版）
     思路：左侧列表常驻（模块在哪永远清楚），分组从「三张卡片」收敛为顶部一段分段器，
     列表因此变成扁平紧凑行，模块数量翻倍也不占更多纵向空间；
     右侧放弃卡片堆叠，改为一张大画布上的分区编辑，标题栏吸底带操作。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方案 B · 分组筛选 + 模块列表 —— 提示词管理样稿</title>
<style>
/* ============ 设计 token（同 src/style.css @theme） ============ */
:root {
  --primary: #0066cc; --primary-focus: #0071e3; --primary-soft: #eaf3fc;
  --ink: #1d1d1f; --muted: #333333; --weak: #7a7a7a; --faint: #cccccc;
  --canvas: #ffffff; --parchment: #f5f5f7; --pearl: #fafafc; --mint: #e8f5ec;
  --hairline: #e0e0e0; --divider: #f0f0f0; --tile: #272729;
  --ai: #6d28d9; --ai-soft: #f5f1ff; --ai-line: #e3d9ff; --ai-hover: #ede4ff;
  --danger: #d70015; --success: #248a3d; --improve: #d97706;
  --grad-primary: linear-gradient(135deg, #0066cc, #0091ff);
  --grad-border-primary: linear-gradient(135deg, rgba(0, 102, 204, .65), rgba(0, 145, 255, .45));
  --shadow-glow: 0 6px 18px rgba(0, 102, 204, .35);
  --shadow-halo: 0 0 0 4px rgba(0, 102, 204, .1);
}

/* ============ 基础 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  display: flex; overflow: hidden; background: var(--parchment); color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.43; letter-spacing: -.22px; -webkit-font-smoothing: antialiased;
}
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, pre { font: inherit; letter-spacing: inherit; }
::placeholder { color: var(--faint); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .14); border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ 应用外壳侧栏（示意） ============ */
.sidebar { width: 240px; flex: none; background: var(--parchment); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 20px; padding: 20px 16px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.brand-logo { width: 28px; height: 28px; border-radius: 8px; background: var(--grad-primary); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
.brand-name { font-size: 19px; font-weight: 600; letter-spacing: -.4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: var(--muted); transition: .15s; }
.nav button svg { flex: none; }
.nav button:hover { background: rgba(255, 255, 255, .6); color: var(--ink); }
.nav button.active { background: var(--canvas); color: var(--ink); font-weight: 600; transform: scale(1.04) translate(-2px, -2px); box-shadow: 0 4px 12px rgba(29, 29, 31, .10); }
.nav button.active svg { color: var(--primary); }
.side-foot { margin-top: auto; }
.db-card { border: 1px solid var(--hairline); border-radius: 11px; background: var(--pearl); padding: 12px; }
.db-card p { font-size: 12px; color: var(--weak); }
.db-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.db-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

/* ============ 按钮 ============ */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; transition: .15s; position: relative; }
.btn svg { flex: none; }
.btn-primary { color: #fff; background-image: var(--grad-primary); }
.btn-primary:hover { box-shadow: var(--shadow-glow); transform: translateY(-1px); }
.btn-primary:active { transform: scale(.97); }
.btn-pearl { border-radius: 8px; background: #fff; }
.btn-pearl::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--grad-border-primary); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.btn-pearl:hover { box-shadow: var(--shadow-halo); }
.btn-pearl:disabled { opacity: .45; cursor: default; }
.btn-pearl:disabled:hover { box-shadow: none; }

/* ============ 页头 ============ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.page-header { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--parchment); border-bottom: 1px solid var(--hairline); }
.page-header h1 { font-size: 21px; font-weight: 600; letter-spacing: .23px; }
.h-right { display: flex; align-items: center; gap: 12px; }
.h-stat { font-size: 12px; color: var(--weak); white-space: nowrap; }
.h-stat b { color: var(--ai); font-weight: 600; }

/* ============ 方案 B 专属：左列表 + 右画布 ============ */
.bd { flex: 1; min-height: 0; display: flex; }

/* 左：分组分段器 + 扁平模块列表 */
.left { width: 292px; flex: none; background: var(--canvas); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0; }
.left-top { flex: none; padding: 14px 14px 12px; border-bottom: 1px solid var(--divider); display: grid; gap: 10px; }
.seg { display: flex; background: var(--parchment); border: 1px solid var(--divider); border-radius: 11px; padding: 3px; }
.seg button { flex: 1; height: 28px; border-radius: 8px; font-size: 12px; color: var(--weak); transition: .15s; white-space: nowrap; }
.seg button.active { background: var(--canvas); border: 1px solid var(--hairline); color: var(--ink); font-weight: 600; }
.search { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--pearl); border: 1px solid var(--divider); color: var(--weak); }
.search input { flex: 1; min-width: 0; border: none; outline: none; background: none; font-size: 12px; color: var(--ink); }
.list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
.cap { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 8px 5px; font-size: 12px; color: var(--weak); }
.cap .n { color: var(--faint); font-size: 10px; }
.row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--ink); transition: .15s; }
.row:hover { background: var(--pearl); }
.row.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.row.active::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--grad-border-primary); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai); flex: none; }
.left-foot { flex: none; padding: 10px 14px; border-top: 1px solid var(--divider); font-size: 12px; color: var(--weak); display: flex; justify-content: space-between; align-items: center; }

/* 右：无卡片画布 + 吸顶模块头 + 分区 */
.right { flex: 1; min-width: 0; overflow-y: auto; background: var(--canvas); }
.m-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 36px 14px; background: rgba(255, 255, 255, .92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--divider); }
.m-title { font-size: 21px; font-weight: 600; letter-spacing: .23px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.m-id { font-size: 10px; font-weight: 400; color: var(--weak); background: var(--pearl); border: 1px solid var(--divider); border-radius: 999px; padding: 2px 8px; letter-spacing: 0; font-family: ui-monospace, Consolas, monospace; }
.m-desc { margin-top: 5px; font-size: 14px; color: var(--weak); }
.m-actions { display: flex; gap: 8px; flex: none; padding-top: 2px; }
.m-body { max-width: 860px; margin: 0 auto; padding: 26px 36px 64px; }
.note { display: flex; gap: 8px; align-items: flex-start; background: var(--pearl); border-radius: 11px; padding: 10px 12px; font-size: 12px; line-height: 1.5; color: var(--muted); }
.note svg { flex: none; color: var(--improve); margin-top: 1px; }
.sec { margin-top: 26px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.sec-head h3 { font-size: 15px; font-weight: 600; }
.sec-head .hint { font-size: 12px; color: var(--faint); }
.ta { width: 100%; min-height: 340px; resize: vertical; background: var(--pearl); border: 1px solid var(--hairline); border-radius: 11px; padding: 12px 14px; font-size: 14px; line-height: 1.7; color: var(--ink); outline: none; transition: border-color .15s; }
.ta:focus { border-color: var(--primary-focus); }
.var-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--divider); }
.var-row:last-child { border-bottom: none; }
.vchip { display: inline-flex; align-items: center; font-size: 12px; color: var(--ai); background: var(--ai-soft); border: 1px solid var(--ai-line); border-radius: 8px; padding: 3px 8px; transition: .15s; flex: none; }
.vchip:hover { background: var(--ai-hover); }
.badge { font-size: 10px; line-height: 1.6; color: var(--muted); background: var(--pearl); border: 1px solid var(--divider); border-radius: 999px; padding: 1px 8px; white-space: nowrap; flex: none; }
.var-body { min-width: 0; }
.var-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.var-val { margin-top: 4px; font-size: 12px; color: var(--weak); line-height: 1.5; word-break: break-all; }
.pre { background: var(--pearl); border: 1px solid var(--divider); border-radius: 11px; padding: 12px 14px; font-size: 12px; line-height: 1.6; letter-spacing: -.12px; color: var(--muted); white-space: pre-wrap; word-break: break-word; overflow: auto; max-height: 380px; }
.divider { border: none; border-top: 1px solid var(--divider); margin: 26px 0 0; }
.m-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 18px; font-size: 12px; }
.st-ok { color: var(--faint); }
.st-dirty { color: var(--improve); }
.st-warn { color: var(--danger); }

/* ============ 演示基建 ============ */
.mock-toast { position: fixed; top: 18px; left: 50%; transform: translate(-50%, -8px); z-index: 99; background: var(--tile); color: #fff; font-size: 12px; letter-spacing: -.12px; padding: 8px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .2s; }
.mock-toast.show { opacity: 1; transform: translate(-50%, 0); }
.mock-badge { position: fixed; right: 16px; bottom: 14px; z-index: 98; background: var(--tile); color: rgba(255, 255, 255, .85); font-size: 12px; padding: 5px 12px; border-radius: 999px; opacity: .9; }
</style>
</head>
<body>
<script src="./data.js"></script>
<script>
  renderShell();
  mockBadge("方案 B · 分组筛选 + 模块列表");
</script>

<main class="main">
  <header class="page-header">
    <h1>提示词管理</h1>
    <div class="h-right">
      <span class="h-stat" id="stat"></span>
      <button class="btn btn-pearl" id="resetAll"></button>
    </div>
  </header>

  <div class="bd">
    <!-- 左：分段器筛组 + 搜索 + 扁平列表 -->
    <aside class="left">
      <div class="left-top">
        <div class="seg" id="groupSeg"></div>
        <label class="search"><input id="q" placeholder="搜索模块名称或 id…" /></label>
      </div>
      <nav class="list" id="list"></nav>
      <div class="left-foot"><span id="footStat"></span><span>放文件即接入</span></div>
    </aside>

    <!-- 右：单画布分区编辑，模块头吸顶 -->
    <section class="right" id="right"></section>
  </div>
</main>

<script>
  /* ---------------- 状态 ---------------- */
  let activeGroup = "all";               // 分段器：全部 / 三个分组
  let selId = "content.term-comment";
  let query = "";
  const sel = () => MODULES.find((m) => m.id === selId);

  /* ---------------- 顶部统计 ---------------- */
  function renderStat() {
    document.getElementById("stat").innerHTML =
      "已自定义 <b>" + customCount() + "</b> / " + MODULES.length;
    const btn = document.getElementById("resetAll");
    btn.innerHTML = icon("refresh") + " 全部恢复默认";
    btn.disabled = customCount() === 0;
  }
  document.getElementById("resetAll").onclick = () => {
    demoResetAll();
    toast("已恢复全部模块的默认提示词");
    renderAll();
  };

  /* ---------------- 分组分段器 ---------------- */
  function renderSeg() {
    const seg = document.getElementById("groupSeg");
    const defs = [["all", "全部", MODULES.length]].concat(
      GROUPS.map((g) => [g.id, g.label, modulesOf(g.id).length])
    );
    seg.innerHTML = defs
      .map(
        ([id, label, n]) =>
          '<button type="button" data-g="' + id + '" class="' + (id === activeGroup ? "active" : "") + '">' +
          label + " " + n + "</button>"
      )
      .join("");
    seg.querySelectorAll("button").forEach((b) => {
      b.onclick = () => {
        activeGroup = b.dataset.g;
        const list = filtered();
        if (list.length && !list.some((m) => m.id === selId)) selId = list[0].id;
        renderAll();
      };
    });
  }

  /* ---------------- 模块列表 ---------------- */
  function filtered() {
    let list = modulesOf(activeGroup);
    if (query) list = list.filter((m) => (m.label + m.id).toLowerCase().includes(query.toLowerCase()));
    return list;
  }
  function renderList() {
    const el = document.getElementById("list");
    const list = filtered();
    if (!list.length) {
      el.innerHTML = '<p style="padding:14px 8px;font-size:12px;color:var(--weak)">没有匹配的模块</p>';
      return;
    }
    if (activeGroup === "all" && !query) {
      // 全部视图：按分组加小节标题，保持分组语境
      el.innerHTML = GROUPS.map((g) => {
        const mods = list.filter((m) => m.group === g.id);
        if (!mods.length) return "";
        return (
          '<div class="cap"><span>' + g.label + '</span><span class="n">' + mods.length + "</span></div>" +
          mods.map(rowHtml).join("")
        );
      }).join("");
    } else {
      el.innerHTML = list.map(rowHtml).join("");
    }
    el.querySelectorAll(".row").forEach((b) => {
      b.onclick = () => { selId = b.dataset.id; renderAll(); };
    });
  }
  function rowHtml(m) {
    return (
      '<button type="button" class="row' + (m.id === selId ? " active" : "") + '" data-id="' + m.id + '" title="' + m.id + '">' +
      "<span>" + m.label + "</span>" + (m.custom ? '<span class="dot" title="已自定义"></span>' : "") + "</button>"
    );
  }

  /* ---------------- 右侧画布 ---------------- */
  function renderRight() {
    const mod = sel();
    const el = document.getElementById("right");
    el.innerHTML =
      '<div class="m-head"><div style="min-width:0">' +
        '<div class="m-title">' + mod.label + '<span class="m-id">' + mod.id + "</span></div>" +
        '<p class="m-desc">' + mod.desc + "</p></div>" +
        '<div class="m-actions">' +
          '<button class="btn btn-pearl" id="resetOne"' + (mod.custom ? "" : " disabled") + ">恢复默认</button>" +
          '<button class="btn btn-primary" id="save">保存</button></div></div>' +
      '<div class="m-body">' +
        (mod.note ? '<div class="note">' + icon("warn") + "<span>" + mod.note + "</span></div>" : "") +

        '<section class="sec"><div class="sec-head"><h3>系统提示词正文</h3><span class="hint" id="charCnt"></span></div>' +
        '<textarea class="ta" id="draft" spellcheck="false"></textarea></section>' +

        '<hr class="divider" />' +
        '<section class="sec"><div class="sec-head"><h3>可用变量</h3><span class="hint">点变量名插入到光标处</span></div>' +
        '<div id="vars"></div></section>' +

        '<hr class="divider" />' +
        '<section class="sec"><div class="sec-head"><h3>预览</h3><span class="hint">变量已代入实际值，与运行期同一套渲染</span></div>' +
        '<pre class="pre" id="previewBox"></pre></section>' +

        '<div class="m-foot" id="mFoot"></div>' +
      "</div>";

    const ta = el.querySelector("#draft");
    ta.value = mod.text;
    ta.oninput = () => renderFoot();

    el.querySelector("#save").onclick = () => {
      demoSave(mod, ta.value);
      toast(mod.text.trim() ? "已保存「" + mod.label + "」" : "「" + mod.label + "」正文为空，已恢复默认");
      renderAll();
    };
    el.querySelector("#resetOne").onclick = () => {
      if (!mod.custom) return;
      demoResetOne(mod);
      toast("已恢复「" + mod.label + "」的默认提示词");
      renderAll();
    };

    const vars = el.querySelector("#vars");
    vars.innerHTML = mod.vars && mod.vars.length
      ? mod.vars
          .map((v) => {
            const val = v.fixedValue !== undefined
              ? "程序固定代入（只读）：" + v.fixedValue
              : v.defaultValue !== undefined
                ? "默认值：" + v.defaultValue
                : "示例：" + v.sample;
            return (
              '<div class="var-row"><button type="button" class="vchip" data-name="' + v.name + '">{' + v.name + "}</button>" +
              '<div class="var-body"><p class="var-desc">' + v.desc + "</p>" +
              '<p class="var-val">' + val + "</p></div>" +
              (v.contract ? '<span class="badge">契约 · 只读</span>' : v.fixedValue !== undefined ? '<span class="badge">契约</span>' : "") +
              "</div>"
            );
          })
          .join("")
      : '<p style="font-size:12px;color:var(--weak)">这个模块没有可用变量。</p>';
    vars.querySelectorAll(".vchip").forEach((b) => {
      b.onclick = () => insertVar(b.dataset.name);
    });

    el.querySelector("#previewBox").textContent = renderPreview(mod, ta.value);
    renderFoot();
  }

  function renderFoot() {
    const mod = sel();
    const ta = document.getElementById("draft");
    const dirty = ta.value !== (mod.custom ? mod.text : mod.default);
    const unknown = unknownPlaceholders(mod, ta.value);
    document.getElementById("charCnt").textContent = ta.value.length + " 字";
    document.getElementById("mFoot").innerHTML =
      (dirty ? '<span class="st-dirty">● 有未保存的改动</span>' : '<span class="st-ok">已保存</span>') +
      (unknown.length
        ? '<span class="st-warn">正文里有未声明的占位符：{' + unknown.join("}、{") + "}（会按字面发送给模型）</span>"
        : "");
  }

  function insertVar(name) {
    const ta = document.getElementById("draft");
    const token = "{" + name + "}";
    const s = ta.selectionStart ?? ta.value.length;
    const e = ta.selectionEnd ?? s;
    ta.value = ta.value.slice(0, s) + token + ta.value.slice(e);
    ta.focus();
    ta.setSelectionRange(s + token.length, s + token.length);
    renderFoot();
  }

  /* ---------------- 搜索 ---------------- */
  document.getElementById("q").oninput = (e) => {
    query = e.target.value.trim();
    renderList();
  };

  /* ---------------- 总渲染 ---------------- */
  function renderAll() {
    renderStat();
    document.getElementById("footStat").textContent = customCount() + " / " + MODULES.length + " 已自定义";
    renderSeg();
    renderList();
    renderRight();
  }
  renderAll();
</script>
</body>
</html>
