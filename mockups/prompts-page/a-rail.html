<!DOCTYPE html>
<!-- 方案 A · 顶部轨道：分组 Tab（能量线）+ 模块胶囊横排
     思路：模块导航全部压进顶部两条横带，纵向空间全部让给编辑区；
     模块在哪、当前在哪个模块，一眼可见；模块再多时轨道横向滚动 + 搜索兜底。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方案 A · 分组 Tab + 模块轨道 —— 提示词管理样稿</title>
<style>
/* ============ 设计 token（同 src/style.css @theme） ============ */
:root {
  --primary: #0066cc; --primary-focus: #0071e3; --primary-soft: #eaf3fc;
  --ink: #1d1d1f; --muted: #333333; --weak: #7a7a7a; --faint: #cccccc;
  --canvas: #ffffff; --parchment: #f5f5f7; --pearl: #fafafc; --mint: #e8f5ec;
  --hairline: #e0e0e0; --divider: #f0f0f0; --tile: #272729;
  --ai: #6d28d9; --ai-soft: #f5f1ff; --ai-line: #e3d9ff; --ai-hover: #ede4ff;
  --danger: #d70015; --success: #248a3d; --improve: #d97706;
  --grad-primary: linear-gradient(135deg, #0066cc, #0091ff);
  --grad-border-primary: linear-gradient(135deg, rgba(0, 102, 204, .65), rgba(0, 145, 255, .45));
  --shadow-glow: 0 6px 18px rgba(0, 102, 204, .35);
  --shadow-halo: 0 0 0 4px rgba(0, 102, 204, .1);
  --shadow-window: 0 24px 60px -12px rgba(0, 0, 0, .18);
}

/* ============ 基础 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  display: flex; overflow: hidden; background: var(--parchment); color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.43; letter-spacing: -.22px; -webkit-font-smoothing: antialiased;
}
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, pre { font: inherit; letter-spacing: inherit; }
::placeholder { color: var(--faint); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .14); border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ 应用外壳侧栏（示意） ============ */
.sidebar { width: 240px; flex: none; background: var(--parchment); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 20px; padding: 20px 16px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.brand-logo { width: 28px; height: 28px; border-radius: 8px; background: var(--grad-primary); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
.brand-name { font-size: 19px; font-weight: 600; letter-spacing: -.4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: var(--muted); transition: .15s; }
.nav button svg { flex: none; }
.nav button:hover { background: rgba(255, 255, 255, .6); color: var(--ink); }
.nav button.active { background: var(--canvas); color: var(--ink); font-weight: 600; transform: scale(1.04) translate(-2px, -2px); box-shadow: 0 4px 12px rgba(29, 29, 31, .10); }
.nav button.active svg { color: var(--primary); }
.side-foot { margin-top: auto; }
.db-card { border: 1px solid var(--hairline); border-radius: 11px; background: var(--pearl); padding: 12px; }
.db-card p { font-size: 12px; color: var(--weak); }
.db-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.db-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

/* ============ 按钮 ============ */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; transition: .15s; position: relative; }
.btn svg { flex: none; }
.btn-primary { color: #fff; background-image: var(--grad-primary); }
.btn-primary:hover { box-shadow: var(--shadow-glow); transform: translateY(-1px); }
.btn-primary:active { transform: scale(.97); }
.btn-pearl { border-radius: 8px; background: #fff; }
.btn-pearl::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--grad-border-primary); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.btn-pearl:hover { box-shadow: var(--shadow-halo); }
.btn-pearl:disabled { opacity: .45; cursor: default; }
.btn-pearl:disabled:hover { box-shadow: none; }

/* ============ 页头 ============ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.page-header { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--parchment); border-bottom: 1px solid var(--hairline); }
.page-header h1 { font-size: 21px; font-weight: 600; letter-spacing: .23px; }
.h-right { display: flex; align-items: center; gap: 12px; }
.h-stat { font-size: 12px; color: var(--weak); white-space: nowrap; }
.h-stat b { color: var(--ai); font-weight: 600; }

/* ============ 方案 A 专属：分组 Tab + 模块轨道 ============ */
.group-band { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px 0 12px; background: var(--canvas); border-bottom: 1px solid var(--hairline); }
.tabs { display: flex; gap: 2px; }
.gtab { position: relative; height: 44px; padding: 0 14px; font-size: 14px; color: var(--weak); display: inline-flex; align-items: center; gap: 7px; transition: color .15s; }
.gtab:hover { color: var(--ink); }
.gtab .cnt { font-size: 10px; line-height: 1; padding: 3px 6px; border-radius: 999px; background: var(--parchment); color: var(--weak); }
.gtab.active { color: var(--ink); font-weight: 600; }
.gtab.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 999px; background: var(--grad-primary); }
.gtab.active .cnt { background: var(--primary-soft); color: var(--primary); }

.search { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--pearl); border: 1px solid var(--divider); width: 210px; flex: none; color: var(--weak); }
.search input { flex: 1; min-width: 0; border: none; outline: none; background: none; font-size: 12px; color: var(--ink); }

.rail-wrap { flex: none; background: var(--canvas); border-bottom: 1px solid var(--hairline); }
.rail { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 10px 24px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 11px; border: 1px solid var(--hairline); background: var(--canvas); font-size: 14px; color: var(--ink); transition: .15s; position: relative; }
.chip:hover { background: var(--pearl); border-color: var(--faint); }
.chip.active { background: var(--primary-soft); border-color: transparent; color: var(--primary); font-weight: 600; }
.chip.active::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--grad-border-primary); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai); flex: none; }
.rail-empty { padding: 14px 24px; font-size: 14px; color: var(--weak); }

/* ============ 主体：左编辑 + 右信息 ============ */
.body-grid { flex: 1; min-height: 0; display: flex; gap: 20px; padding: 20px 24px 24px; align-items: stretch; }
.card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 18px; }

.editor { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 22px 24px 16px; overflow-y: auto; }
.e-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.e-title { font-size: 21px; font-weight: 600; letter-spacing: .23px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.e-id { font-size: 10px; font-weight: 400; color: var(--weak); background: var(--pearl); border: 1px solid var(--divider); border-radius: 999px; padding: 2px 8px; letter-spacing: 0; font-family: ui-monospace, Consolas, monospace; }
.e-desc { margin-top: 6px; font-size: 14px; color: var(--weak); }
.e-actions { display: flex; gap: 8px; flex: none; }
.note { display: flex; gap: 8px; align-items: flex-start; background: var(--pearl); border-radius: 11px; padding: 10px 12px; font-size: 12px; line-height: 1.5; color: var(--muted); margin-top: 14px; }
.note svg { flex: none; color: var(--improve); margin-top: 1px; }
.e-label-row { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 0 8px; }
.e-label-row .lab { font-size: 12px; color: var(--weak); }
.e-label-row .cnt { font-size: 12px; color: var(--faint); }
.ta { width: 100%; flex: 1; min-height: 260px; resize: vertical; background: var(--pearl); border: 1px solid var(--hairline); border-radius: 11px; padding: 12px 14px; font-size: 14px; line-height: 1.7; color: var(--ink); outline: none; transition: border-color .15s; }
.ta:focus { border-color: var(--primary-focus); }
.e-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; }
.st-ok { color: var(--faint); }
.st-dirty { color: var(--improve); }
.st-warn { color: var(--danger); }

/* 右侧信息卡：变量 / 预览 用分段器切换，省纵向空间 */
.info { width: 360px; flex: none; display: flex; flex-direction: column; overflow: hidden; }
.info-head { padding: 14px 14px 0; }
.seg { display: flex; background: var(--parchment); border: 1px solid var(--divider); border-radius: 11px; padding: 3px; }
.seg button { flex: 1; height: 28px; border-radius: 8px; font-size: 12px; color: var(--weak); transition: .15s; }
.seg button.active { background: var(--canvas); border: 1px solid var(--hairline); color: var(--ink); font-weight: 600; }
.info-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }
.var-row { padding: 10px 2px; border-bottom: 1px solid var(--divider); }
.var-row:last-child { border-bottom: none; }
.var-top { display: flex; align-items: center; gap: 8px; }
.vchip { display: inline-flex; align-items: center; font-size: 12px; color: var(--ai); background: var(--ai-soft); border: 1px solid var(--ai-line); border-radius: 8px; padding: 3px 8px; transition: .15s; }
.vchip:hover { background: var(--ai-hover); }
.badge { font-size: 10px; line-height: 1.6; color: var(--muted); background: var(--pearl); border: 1px solid var(--divider); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.var-desc { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.var-val { margin-top: 4px; font-size: 12px; color: var(--weak); line-height: 1.5; word-break: break-all; }
.pre { background: var(--pearl); border: 1px solid var(--divider); border-radius: 11px; padding: 12px 14px; font-size: 12px; line-height: 1.6; letter-spacing: -.12px; color: var(--muted); white-space: pre-wrap; word-break: break-word; overflow: auto; }

/* ============ 演示基建 ============ */
.mock-toast { position: fixed; top: 18px; left: 50%; transform: translate(-50%, -8px); z-index: 99; background: var(--tile); color: #fff; font-size: 12px; letter-spacing: -.12px; padding: 8px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .2s; }
.mock-toast.show { opacity: 1; transform: translate(-50%, 0); }
.mock-badge { position: fixed; right: 16px; bottom: 14px; z-index: 98; background: var(--tile); color: rgba(255, 255, 255, .85); font-size: 12px; padding: 5px 12px; border-radius: 999px; opacity: .9; }
</style>
</head>
<body>
<script src="./data.js"></script>
<script>
  renderShell();
  mockBadge("方案 A · 分组 Tab + 模块轨道");
</script>

<main class="main">
  <header class="page-header">
    <h1>提示词管理</h1>
    <div class="h-right">
      <span class="h-stat" id="stat"></span>
      <button class="btn btn-pearl" id="resetAll"></button>
    </div>
  </header>

  <!-- 第一条横带：分组 Tab（选中组 + 各组模块数），右侧全局搜索 -->
  <div class="group-band">
    <nav class="tabs" id="tabs"></nav>
    <label class="search" id="searchBox"><input id="q" placeholder="搜索模块名称或 id…" /></label>
  </div>

  <!-- 第二条横带：当前组下的模块胶囊轨道，横向滚动应对模块增多 -->
  <div class="rail-wrap"><div class="rail" id="rail"></div></div>

  <!-- 主体：编辑卡 + 信息卡（变量 / 预览 分段切换） -->
  <div class="body-grid">
    <section class="card editor" id="editor"></section>
    <aside class="card info">
      <div class="info-head">
        <div class="seg" id="infoSeg">
          <button type="button" data-pane="vars" class="active" id="segVars">可用变量</button>
          <button type="button" data-pane="preview" id="segPrev">预览</button>
        </div>
      </div>
      <div class="info-body">
        <div id="paneVars"></div>
        <div id="panePreview" hidden><pre class="pre" id="previewBox"></pre></div>
      </div>
    </aside>
  </div>
</main>

<script>
  /* ---------------- 状态 ---------------- */
  let activeGroup = "content";           // 默认落在「内容生成 · 学期评语」
  let selId = "content.term-comment";
  let query = "";
  let infoPane = "vars";
  const sel = () => MODULES.find((m) => m.id === selId);

  /* ---------------- 顶部：统计 / 全部恢复 ---------------- */
  function renderStat() {
    document.getElementById("stat").innerHTML =
      "已自定义 <b>" + customCount() + "</b> / " + MODULES.length;
    const btn = document.getElementById("resetAll");
    btn.innerHTML = icon("refresh") + " 全部恢复默认";
    btn.disabled = customCount() === 0;
  }
  document.getElementById("resetAll").onclick = () => {
    demoResetAll();
    toast("已恢复全部模块的默认提示词");
    renderAll();
  };

  /* ---------------- 分组 Tab ---------------- */
  function renderTabs() {
    const el = document.getElementById("tabs");
    el.innerHTML =
      GROUPS.map((g) => {
        const n = modulesOf(g.id).length;
        return (
          '<button type="button" class="gtab' + (g.id === activeGroup && !query ? " active" : "") + '" data-g="' + g.id + '">' +
          g.label + '<span class="cnt">' + n + "</span></button>"
        );
      }).join("");
    el.querySelectorAll(".gtab").forEach((b) => {
      b.onclick = () => {
        query = "";
        document.getElementById("q").value = "";
        activeGroup = b.dataset.g;
        selId = modulesOf(activeGroup)[0].id; // 切组后落组内第一个模块
        renderAll();
      };
    });
  }

  /* ---------------- 模块轨道 ---------------- */
  function renderRail() {
    const el = document.getElementById("rail");
    const list = query
      ? MODULES.filter((m) => (m.label + m.id).toLowerCase().includes(query.toLowerCase()))
      : modulesOf(activeGroup);
    if (!list.length) {
      el.innerHTML = '<p class="rail-empty">没有匹配「' + query + '」的模块</p>';
      return;
    }
    el.innerHTML = list
      .map(
        (m) =>
          '<button type="button" class="chip' + (m.id === selId ? " active" : "") + '" data-id="' + m.id + '" title="' + m.id + '">' +
          m.label + (m.custom ? '<span class="dot" title="已自定义"></span>' : "") + "</button>",
      )
      .join("");
    el.querySelectorAll(".chip").forEach((b) => {
      b.onclick = () => { selId = b.dataset.id; renderAll(); };
    });
    // 搜索时高亮「全部匹配」所属的组，Tab 恢复无选中态
    if (query) el.scrollLeft = 0;
  }

  /* ---------------- 编辑卡 ---------------- */
  function renderEditor() {
    const mod = sel();
    const el = document.getElementById("editor");
    el.innerHTML =
      '<div class="e-head"><div style="min-width:0">' +
        '<div class="e-title">' + mod.label + '<span class="e-id">' + mod.id + "</span></div>" +
        '<p class="e-desc">' + mod.desc + "</p></div>" +
        '<div class="e-actions">' +
          '<button class="btn btn-pearl" id="resetOne"' + (mod.custom ? "" : " disabled") + ">恢复默认</button>" +
          '<button class="btn btn-primary" id="save">保存</button></div></div>' +
      (mod.note ? '<div class="note">' + icon("warn") + "<span>" + mod.note + "</span></div>" : "") +
      '<div class="e-label-row"><span class="lab">系统提示词正文</span><span class="cnt" id="charCnt"></span></div>' +
      '<textarea class="ta" id="draft" spellcheck="false"></textarea>' +
      '<div class="e-foot" id="eFoot"></div>';

    const ta = el.querySelector("#draft");
    ta.value = mod.text;
    ta.oninput = () => renderFoot();

    el.querySelector("#save").onclick = () => {
      demoSave(mod, ta.value);
      toast(mod.text.trim() ? "已保存「" + mod.label + "」" : "「" + mod.label + "」正文为空，已恢复默认");
      renderAll();
    };
    el.querySelector("#resetOne").onclick = () => {
      if (!mod.custom) return;
      demoResetOne(mod);
      toast("已恢复「" + mod.label + "」的默认提示词");
      renderAll();
    };
    renderFoot();
  }

  /** 底部状态行：字数 / 未保存 / 未知占位符 */
  function renderFoot() {
    const mod = sel();
    const ta = document.getElementById("draft");
    const dirty = ta.value !== (mod.custom ? mod.text : mod.default);
    const unknown = unknownPlaceholders(mod, ta.value);
    document.getElementById("charCnt").textContent = ta.value.length + " 字";
    document.getElementById("eFoot").innerHTML =
      (dirty
        ? '<span class="st-dirty">● 有未保存的改动</span>'
        : '<span class="st-ok">已保存</span>') +
      (unknown.length
        ? '<span class="st-warn">正文里有未声明的占位符：{' + unknown.join("}、{") + "}（会按字面发送给模型）</span>"
        : "");
  }

  /* ---------------- 信息卡：变量 / 预览 ---------------- */
  function renderInfo() {
    const mod = sel();
    const segV = document.getElementById("segVars");
    const segP = document.getElementById("segPrev");
    segV.textContent = "可用变量" + (mod.vars && mod.vars.length ? " · " + mod.vars.length : "");
    segP.textContent = "预览";

    const vars = document.getElementById("paneVars");
    vars.innerHTML = mod.vars && mod.vars.length
      ? mod.vars
          .map((v) => {
            const val = v.fixedValue !== undefined
              ? "程序固定代入（只读）：" + v.fixedValue
              : v.defaultValue !== undefined
                ? "默认值：" + v.defaultValue
                : "示例：" + v.sample;
            return (
              '<div class="var-row"><div class="var-top">' +
              '<button type="button" class="vchip" data-name="' + v.name + '">{' + v.name + "}</button>" +
              (v.contract ? '<span class="badge">契约 · 只读</span>' : v.fixedValue !== undefined ? '<span class="badge">契约</span>' : "") +
              "</div>" +
              '<p class="var-desc">' + v.desc + "</p>" +
              '<p class="var-val">' + val + "</p></div>"
            );
          })
          .join("")
      : '<p style="font-size:12px;color:var(--weak);padding:8px 2px">这个模块没有可用变量。</p>';

    document.getElementById("previewBox").textContent = renderPreview(mod, document.getElementById("draft").value);

    segV.onclick = () => { infoPane = "vars"; renderInfoPane(); };
    segP.onclick = () => { infoPane = "preview"; renderInfoPane(); };
    renderInfoPane();

    // 点变量名 → 插入正文光标处
    vars.querySelectorAll(".vchip").forEach((b) => {
      b.onclick = () => insertVar(b.dataset.name);
    });
  }
  function renderInfoPane() {
    document.getElementById("paneVars").hidden = infoPane !== "vars";
    document.getElementById("panePreview").hidden = infoPane !== "preview";
    document.getElementById("segVars").classList.toggle("active", infoPane === "vars");
    document.getElementById("segPrev").classList.toggle("active", infoPane === "preview");
  }
  function insertVar(name) {
    const ta = document.getElementById("draft");
    const token = "{" + name + "}";
    const s = ta.selectionStart ?? ta.value.length;
    const e = ta.selectionEnd ?? s;
    ta.value = ta.value.slice(0, s) + token + ta.value.slice(e);
    ta.focus();
    ta.setSelectionRange(s + token.length, s + token.length);
    renderFoot();
  }

  /* ---------------- 搜索 ---------------- */
  document.getElementById("q").oninput = (e) => {
    query = e.target.value.trim();
    renderTabs();
    renderRail();
  };

  /* ---------------- 总渲染 ---------------- */
  function renderAll() {
    renderStat();
    renderTabs();
    renderRail();
    renderEditor();
    renderInfo();
  }
  renderAll();
</script>
</body>
</html>
