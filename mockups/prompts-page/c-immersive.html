<!DOCTYPE html>
<!-- 方案 C · 沉浸编辑 + 模块切换器（聚焦最大化）
     思路：不做常驻模块列表，编辑视野最大化；「看模块」收进一个醒目的
     「切换模块」按钮（展开分组搜索面板），配合上/下一模块与 ←/→ 快捷键秒切。
     适合模块继续膨胀后仍然只关心当前模块的使用方式。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方案 C · 沉浸编辑 + 模块切换器 —— 提示词管理样稿</title>
<style>
/* ============ 设计 token（同 src/style.css @theme） ============ */
:root {
  --primary: #0066cc; --primary-focus: #0071e3; --primary-soft: #eaf3fc;
  --ink: #1d1d1f; --muted: #333333; --weak: #7a7a7a; --faint: #cccccc;
  --canvas: #ffffff; --parchment: #f5f5f7; --pearl: #fafafc; --mint: #e8f5ec;
  --hairline: #e0e0e0; --divider: #f0f0f0; --tile: #272729;
  --ai: #6d28d9; --ai-soft: #f5f1ff; --ai-line: #e3d9ff; --ai-hover: #ede4ff;
  --danger: #d70015; --success: #248a3d; --improve: #d97706;
  --grad-primary: linear-gradient(135deg, #0066cc, #0091ff);
  --grad-border-primary: linear-gradient(135deg, rgba(0, 102, 204, .65), rgba(0, 145, 255, .45));
  --shadow-glow: 0 6px 18px rgba(0, 102, 204, .35);
  --shadow-halo: 0 0 0 4px rgba(0, 102, 204, .1);
  --shadow-window: 0 24px 60px -12px rgba(0, 0, 0, .18);
}

/* ============ 基础 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  display: flex; overflow: hidden; background: var(--parchment); color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.43; letter-spacing: -.22px; -webkit-font-smoothing: antialiased;
}
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, pre { font: inherit; letter-spacing: inherit; }
::placeholder { color: var(--faint); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .14); border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ 应用外壳侧栏（示意） ============ */
.sidebar { width: 240px; flex: none; background: var(--parchment); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 20px; padding: 20px 16px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.brand-logo { width: 28px; height: 28px; border-radius: 8px; background: var(--grad-primary); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
.brand-name { font-size: 19px; font-weight: 600; letter-spacing: -.4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: var(--muted); transition: .15s; }
.nav button svg { flex: none; }
.nav button:hover { background: rgba(255, 255, 255, .6); color: var(--ink); }
.nav button.active { background: var(--canvas); color: var(--ink); font-weight: 600; transform: scale(1.04) translate(-2px, -2px); box-shadow: 0 4px 12px rgba(29, 29, 31, .10); }
.nav button.active svg { color: var(--primary); }
.side-foot { margin-top: auto; }
.db-card { border: 1px solid var(--hairline); border-radius: 11px; background: var(--pearl); padding: 12px; }
.db-card p { font-size: 12px; color: var(--weak); }
.db-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.db-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

/* ============ 按钮 ============ */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; transition: .15s; position: relative; }
.btn svg { flex: none; }
.btn-primary { color: #fff; background-image: var(--grad-primary); }
.btn-primary:hover { box-shadow: var(--shadow-glow); transform: translateY(-1px); }
.btn-primary:active { transform: scale(.97); }
.btn-pearl { border-radius: 8px; background: #fff; }
.btn-pearl::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--grad-border-primary); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.btn-pearl:hover { box-shadow: var(--shadow-halo); }
.btn-pearl:disabled { opacity: .45; cursor: default; }
.btn-pearl:disabled:hover { box-shadow: none; }
.btn-icon { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: 50%; color: var(--muted); border: 1px solid var(--hairline); background: var(--canvas); }
.btn-icon:hover { color: var(--ink); box-shadow: var(--shadow-halo); }
.btn-icon:disabled { opacity: .4; cursor: default; box-shadow: none; }

/* ============ 页头 + 切换条 ============ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.page-header { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--parchment); border-bottom: 1px solid var(--hairline); }
.page-header h1 { font-size: 21px; font-weight: 600; letter-spacing: .23px; }
.h-right { display: flex; align-items: center; gap: 12px; }
.h-stat { font-size: 12px; color: var(--weak); white-space: nowrap; }
.h-stat b { color: var(--ai); font-weight: 600; }

.switch-bar { flex: none; position: relative; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--canvas); border-bottom: 1px solid var(--hairline); }
.crumb { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
.crumb .g { color: var(--weak); }
.crumb .sep { color: var(--faint); }
.crumb .m { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.switch-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pos { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* ============ 主体：居中单栏 ============ */
.c-body { flex: 1; min-height: 0; overflow-y: auto; }
.c-col { max-width: 780px; margin: 0 auto; padding: 34px 28px 90px; }
.eyebrow { font-size: 12px; color: var(--primary); font-weight: 600; }
.c-title { margin-top: 6px; font-size: 28px; font-weight: 600; letter-spacing: -.37px; line-height: 1.25; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.c-id { font-size: 10px; font-weight: 400; color: var(--weak); background: var(--canvas); border: 1px solid var(--hairline); border-radius: 999px; padding: 2px 8px; letter-spacing: 0; font-family: ui-monospace, Consolas, monospace; }
.c-desc { margin-top: 8px; font-size: 14px; color: var(--weak); line-height: 1.5; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.meta-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
.meta-chip.custom { color: var(--ai); background: var(--ai-soft); border: 1px solid var(--ai-line); }
.meta-chip.plain { color: var(--muted); background: var(--canvas); border: 1px solid var(--hairline); }
.meta-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai); }
.c-actions { display: flex; gap: 8px; margin-top: 18px; }
.note { display: flex; gap: 8px; align-items: flex-start; background: var(--pearl); border: 1px solid var(--divider); border-radius: 11px; padding: 10px 12px; font-size: 12px; line-height: 1.5; color: var(--muted); margin-top: 16px; }
.note svg { flex: none; color: var(--improve); margin-top: 1px; }

/* 编辑器：页面上唯一的卡片，绝对主角 */
.editor-card { margin-top: 14px; background: var(--canvas); border: 1px solid var(--hairline); border-radius: 18px; overflow: hidden; }
.ec-head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 0; }
.ec-head .lab { font-size: 12px; color: var(--weak); }
.ec-head .cnt { font-size: 12px; color: var(--faint); }
.ec-ta { display: block; width: 100%; min-height: 400px; resize: vertical; border: none; outline: none; background: transparent; padding: 12px 18px 6px; font-size: 14px; line-height: 1.7; color: var(--ink); }
.ec-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 18px; border-top: 1px solid var(--divider); font-size: 12px; }
.st-ok { color: var(--faint); }
.st-dirty { color: var(--improve); }
.st-warn { color: var(--danger); }

/* 折叠区：变量 / 预览 */
details.fold { margin-top: 12px; background: var(--canvas); border: 1px solid var(--hairline); border-radius: 14px; }
details.fold summary { display: flex; align-items: center; gap: 8px; padding: 11px 16px; font-size: 14px; color: var(--ink); cursor: pointer; list-style: none; user-select: none; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary .chev { margin-left: auto; color: var(--faint); transition: transform .15s; }
details.fold[open] summary .chev { transform: rotate(180deg); }
details.fold summary .n { font-size: 10px; color: var(--weak); background: var(--pearl); border: 1px solid var(--divider); border-radius: 999px; padding: 1px 8px; }
.fold-body { padding: 2px 16px 12px; }
.var-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--divider); }
.var-row:last-child { border-bottom: none; }
.vchip { display: inline-flex; align-items: center; font-size: 12px; color: var(--ai); background: var(--ai-soft); border: 1px solid var(--ai-line); border-radius: 8px; padding: 3px 8px; transition: .15s; flex: none; }
.vchip:hover { background: var(--ai-hover); }
.badge { font-size: 10px; line-height: 1.6; color: var(--muted); background: var(--pearl); border: 1px solid var(--divider); border-radius: 999px; padding: 1px 8px; white-space: nowrap; flex: none; }
.var-body { min-width: 0; }
.var-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.var-val { margin-top: 4px; font-size: 12px; color: var(--weak); line-height: 1.5; word-break: break-all; }
.pre { background: var(--pearl); border: 1px solid var(--divider); border-radius: 11px; padding: 12px 14px; font-size: 12px; line-height: 1.6; letter-spacing: -.12px; color: var(--muted); white-space: pre-wrap; word-break: break-word; overflow: auto; max-height: 380px; }

/* ============ 模块切换面板（mega menu） ============ */
.mega-mask { position: fixed; inset: 0; z-index: 40; display: none; }
.mega-mask.open { display: block; }
.mega { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); width: 640px; max-height: min(620px, calc(100vh - 90px)); display: flex; flex-direction: column; background: var(--canvas); border: 1px solid var(--hairline); border-radius: 18px; box-shadow: var(--shadow-window); overflow: hidden; }
.mega-search { flex: none; display: flex; align-items: center; gap: 8px; margin: 14px 14px 10px; height: 34px; padding: 0 13px; border-radius: 999px; background: var(--pearl); border: 1px solid var(--divider); color: var(--weak); }
.mega-search input { flex: 1; min-width: 0; border: none; outline: none; background: none; font-size: 14px; color: var(--ink); }
.mega-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 10px; }
.mega-cap { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 10px 5px; font-size: 12px; color: var(--weak); }
.mega-cap .d { font-size: 11px; color: var(--faint); font-weight: 400; }
.mega-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 8px; font-size: 14px; color: var(--ink); transition: .12s; text-align: left; }
.mrow:hover { background: var(--pearl); }
.mrow.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.mrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai); flex: none; }
.mega-foot { flex: none; padding: 9px 16px; border-top: 1px solid var(--divider); font-size: 12px; color: var(--faint); display: flex; justify-content: space-between; }
kbd { font: inherit; font-size: 11px; color: var(--muted); background: var(--pearl); border: 1px solid var(--divider); border-radius: 5px; padding: 0 5px; }
.switch-hint { font-size: 12px; color: var(--faint); display: inline-flex; align-items: center; gap: 5px; }

/* ============ 演示基建 ============ */
.mock-toast { position: fixed; top: 18px; left: 50%; transform: translate(-50%, -8px); z-index: 99; background: var(--tile); color: #fff; font-size: 12px; letter-spacing: -.12px; padding: 8px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .2s; }
.mock-toast.show { opacity: 1; transform: translate(-50%, 0); }
.mock-badge { position: fixed; right: 16px; bottom: 14px; z-index: 98; background: var(--tile); color: rgba(255, 255, 255, .85); font-size: 12px; padding: 5px 12px; border-radius: 999px; opacity: .9; }
</style>
</head>
<body>
<script src="./data.js"></script>
<script>
  renderShell();
  mockBadge("方案 C · 沉浸编辑 + 切换器（←/→ 可切模块）");
</script>

<main class="main">
  <header class="page-header">
    <h1>提示词管理</h1>
    <div class="h-right">
      <span class="h-stat" id="stat"></span>
      <button class="btn btn-pearl" id="resetAll"></button>
    </div>
  </header>

  <!-- 切换条：看模块的唯一入口 = 「切换模块」按钮 + 前后翻页 -->
  <div class="switch-bar">
    <button class="btn btn-pearl" id="switcher" style="height:34px"></button>
    <div class="crumb" id="crumb"></div>
    <div class="switch-right">
      <span class="pos" id="pos"></span>
      <button class="btn btn-icon" id="prev" title="上一个模块（←）"></button>
      <button class="btn btn-icon" id="next" title="下一个模块（→）"></button>
    </div>
  </div>

  <!-- 居中单栏：模块即页面主角 -->
  <div class="c-body" id="cbody">
    <div class="c-col" id="ccol"></div>
  </div>

  <!-- 模块切换面板 -->
  <div class="mega-mask" id="megaMask">
    <div class="mega" role="dialog" aria-label="切换模块">
      <label class="mega-search"><input id="megaQ" placeholder="搜索模块名称或 id…" /></label>
      <div class="mega-list" id="megaList"></div>
      <div class="mega-foot"><span>输入名称筛选 · 点击切换</span><span><kbd>Esc</kbd> 关闭</span></div>
    </div>
  </div>
</main>

<script>
  /* ---------------- 状态 ---------------- */
  let selId = "content.term-comment";
  const sel = () => MODULES.find((m) => m.id === selId);
  const idxOf = (id) => MODULES.findIndex((m) => m.id === id);

  /* ---------------- 顶部统计 ---------------- */
  function renderStat() {
    document.getElementById("stat").innerHTML =
      "已自定义 <b>" + customCount() + "</b> / " + MODULES.length;
    const btn = document.getElementById("resetAll");
    btn.innerHTML = icon("refresh") + " 全部恢复默认";
    btn.disabled = customCount() === 0;
  }
  document.getElementById("resetAll").onclick = () => {
    demoResetAll();
    toast("已恢复全部模块的默认提示词");
    renderAll();
  };

  /* ---------------- 切换条 ---------------- */
  function renderBar() {
    const mod = sel();
    const i = idxOf(mod.id);
    document.getElementById("switcher").innerHTML =
      icon("grid") + " 切换模块 " + icon("chevD");
    document.getElementById("crumb").innerHTML =
      '<span class="g">' + groupOf(mod.group).label + '</span><span class="sep">/</span><span class="m">' + mod.label + "</span>";
    document.getElementById("pos").textContent = (i + 1) + " / " + MODULES.length;
    document.getElementById("prev").innerHTML = icon("chevL");
    document.getElementById("next").innerHTML = icon("chevR");
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === MODULES.length - 1;
  }
  function go(delta) {
    const i = idxOf(selId);
    const j = Math.min(MODULES.length - 1, Math.max(0, i + delta));
    if (j !== i) { selId = MODULES[j].id; renderAll(); }
  }
  document.getElementById("prev").onclick = () => go(-1);
  document.getElementById("next").onclick = () => go(1);

  /* ---------------- 切换面板 ---------------- */
  const mask = document.getElementById("megaMask");
  let megaQuery = "";
  function openMega() {
    megaQuery = "";
    document.getElementById("megaQ").value = "";
    renderMegaList();
    mask.classList.add("open");
    document.getElementById("megaQ").focus();
  }
  function closeMega() { mask.classList.remove("open"); }
  document.getElementById("switcher").onclick = () =>
    mask.classList.contains("open") ? closeMega() : openMega();
  mask.addEventListener("mousedown", (e) => { if (e.target === mask) closeMega(); });
  document.getElementById("megaQ").oninput = (e) => {
    megaQuery = e.target.value.trim();
    renderMegaList();
  };

  function renderMegaList() {
    const el = document.getElementById("megaList");
    const match = (m) => !megaQuery || (m.label + m.id).toLowerCase().includes(megaQuery.toLowerCase());
    el.innerHTML = GROUPS.map((g) => {
      const mods = MODULES.filter((m) => m.group === g.id && match(m));
      if (!mods.length) return "";
      return (
        '<div class="mega-cap"><span>' + g.label + '</span><span class="d">' + g.desc + "</span></div>" +
        '<div class="mega-grid">' +
        mods.map((m) =>
          '<button type="button" class="mrow' + (m.id === selId ? " active" : "") + '" data-id="' + m.id + '">' +
          "<span>" + m.label + "</span>" + (m.custom ? '<span class="dot" title="已自定义"></span>' : "") + "</button>"
        ).join("") +
        "</div>"
      );
    }).join("") ||
      '<p style="padding:18px 10px;font-size:12px;color:var(--weak)">没有匹配的模块</p>';
    el.querySelectorAll(".mrow").forEach((b) => {
      b.onclick = () => { selId = b.dataset.id; closeMega(); renderAll(); };
    });
  }

  /* ---------------- 主体单栏 ---------------- */
  function renderMain() {
    const mod = sel();
    const el = document.getElementById("ccol");
    const varCount = mod.vars ? mod.vars.length : 0;
    const contractCount = (mod.vars || []).filter((v) => v.fixedValue !== undefined).length;

    el.innerHTML =
      '<p class="eyebrow">' + groupOf(mod.group).label + "</p>" +
      '<h2 class="c-title">' + mod.label + '<span class="c-id">' + mod.id + "</span></h2>" +
      '<p class="c-desc">' + mod.desc + "</p>" +
      '<div class="meta">' +
        (mod.custom
          ? '<span class="meta-chip custom"><span class="dot"></span>已自定义 · ' + (mod.updatedAt || "") + "</span>"
          : '<span class="meta-chip plain">使用出厂默认文案</span>') +
        (varCount ? '<span class="meta-chip plain">变量 ' + varCount + "</span>" : "") +
        (contractCount ? '<span class="meta-chip plain">契约 ' + contractCount + "</span>" : "") +
      "</div>" +
      '<div class="c-actions">' +
        '<button class="btn btn-pearl" id="resetOne"' + (mod.custom ? "" : " disabled") + ">恢复默认</button>" +
        '<button class="btn btn-primary" id="save">保存</button>' +
      "</div>" +
      (mod.note ? '<div class="note">' + icon("warn") + "<span>" + mod.note + "</span></div>" : "") +

      '<div class="editor-card">' +
        '<div class="ec-head"><span class="lab">系统提示词正文</span><span class="cnt" id="charCnt"></span></div>' +
        '<textarea class="ec-ta" id="draft" spellcheck="false"></textarea>' +
        '<div class="ec-foot" id="ecFoot"></div>' +
      "</div>" +

      '<details class="fold"' + (varCount ? " open" : "") + ">" +
        "<summary>可用变量" + (varCount ? ' <span class="n">' + varCount + "</span>" : "") + '<span class="chev">' + icon("chevD") + "</span></summary>" +
        '<div class="fold-body" id="vars"></div>' +
      "</details>" +

      '<details class="fold">' +
        "<summary>预览 · 按当前正文渲染<span class=\"chev\">" + icon("chevD") + "</span></summary>" +
        '<div class="fold-body"><pre class="pre" id="previewBox"></pre></div>' +
      "</details>";

    const ta = el.querySelector("#draft");
    ta.value = mod.text;
    ta.oninput = () => renderFoot();

    el.querySelector("#save").onclick = () => {
      demoSave(mod, ta.value);
      toast(mod.text.trim() ? "已保存「" + mod.label + "」" : "「" + mod.label + "」正文为空，已恢复默认");
      renderAll();
    };
    el.querySelector("#resetOne").onclick = () => {
      if (!mod.custom) return;
      demoResetOne(mod);
      toast("已恢复「" + mod.label + "」的默认提示词");
      renderAll();
    };

    const vars = el.querySelector("#vars");
    vars.innerHTML = varCount
      ? mod.vars
          .map((v) => {
            const val = v.fixedValue !== undefined
              ? "程序固定代入（只读）：" + v.fixedValue
              : v.defaultValue !== undefined
                ? "默认值：" + v.defaultValue
                : "示例：" + v.sample;
            return (
              '<div class="var-row"><button type="button" class="vchip" data-name="' + v.name + '">{' + v.name + "}</button>" +
              '<div class="var-body"><p class="var-desc">' + v.desc + "</p>" +
              '<p class="var-val">' + val + "</p></div>" +
              (v.contract ? '<span class="badge">契约 · 只读</span>' : v.fixedValue !== undefined ? '<span class="badge">契约</span>' : "") +
              "</div>"
            );
          })
          .join("")
      : '<p style="font-size:12px;color:var(--weak);padding:6px 0">这个模块没有可用变量。</p>';
    vars.querySelectorAll(".vchip").forEach((b) => {
      b.onclick = () => insertVar(b.dataset.name);
    });

    el.querySelector("#previewBox").textContent = renderPreview(mod, ta.value);
    renderFoot();
  }

  function renderFoot() {
    const mod = sel();
    const ta = document.getElementById("draft");
    const dirty = ta.value !== (mod.custom ? mod.text : mod.default);
    const unknown = unknownPlaceholders(mod, ta.value);
    document.getElementById("charCnt").textContent = ta.value.length + " 字";
    document.getElementById("ecFoot").innerHTML =
      (dirty ? '<span class="st-dirty">● 有未保存的改动</span>' : '<span class="st-ok">已保存</span>') +
      (unknown.length
        ? '<span class="st-warn">正文里有未声明的占位符：{' + unknown.join("}、{") + "}（会按字面发送给模型）</span>"
        : "");
  }

  function insertVar(name) {
    const ta = document.getElementById("draft");
    const token = "{" + name + "}";
    const s = ta.selectionStart ?? ta.value.length;
    const e = ta.selectionEnd ?? s;
    ta.value = ta.value.slice(0, s) + token + ta.value.slice(e);
    ta.focus();
    ta.setSelectionRange(s + token.length, s + token.length);
    renderFoot();
  }

  /* ---------------- 键盘：←/→ 切模块，Esc 关面板 ---------------- */
  document.addEventListener("keydown", (e) => {
    const inField = ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName);
    if (e.key === "Escape") { closeMega(); return; }
    if (inField) return;
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  });

  /* ---------------- 总渲染 ---------------- */
  function renderAll() {
    renderStat();
    renderBar();
    renderMain();
  }
  renderAll();
</script>
</body>
</html>
